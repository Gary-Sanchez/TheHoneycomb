<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Attendance tracking and cross-referencing for the Caserits English-learning activities." />
    <meta name="theme-color" content="#2D3E35" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Production-mode CSP. Fonts are self-hosted (US-55: @font-face in
      src/index.css points at the @fontsource-variable packages, bundled into
      dist/assets), so font-src needs only 'self'. The Smart Doc Parser
      runs locally on the server (parser.ts) with no external API, so the page
      only ever talks to its own origin (connect-src 'self'). In dev,
      vite.config.ts's cspDevServerPlugin swaps this for a relaxed policy that
      Vite's HMR client/React Fast Refresh need (inline script, ws:// to the dev
      server) — see that plugin for why. worker-src allows blob: because
      canvas-confetti (the celebratory confetti effect) spins up a worker from
      a same-origin blob URL.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>The Honeycomb</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
