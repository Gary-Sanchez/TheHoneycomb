<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Production-mode CSP. fonts.googleapis.com/fonts.gstatic.com are allowed
      because src/index.css @imports Google Fonts directly. The Smart Doc Parser
      runs locally on the server (parser.ts) with no external API, so the page
      only ever talks to its own origin (connect-src 'self'). In dev,
      vite.config.ts's cspDevServerPlugin swaps this for a relaxed policy that
      Vite's HMR client/React Fast Refresh need (inline script, ws:// to the dev
      server) — see that plugin for why. worker-src allows blob: because
      canvas-confetti (the celebratory confetti effect) spins up a worker from
      a same-origin blob URL.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>The Honeycomb</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
