name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # US-13: npm audit = 0 can break with no code change when a new advisory is
  # published, so audit main daily too (see docs/US-13-npm-audit.md).
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  lint-and-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Reads package-lock.json only; fails on any vulnerability (US-13 requires 0).
      - name: npm audit
        run: npm audit
